  - kod: "v-sogutlu"
    olcum: "sogutlu-1080"
    dosya: "uzun/sogutlu-1080.v1.mp4"
    kapak: "img/kapak/ATACAD_Claude_Sogutlu_v3_kapak.jpg"
    tr: { baslik: "Araziden 3B modele", yazi: "Arazi, yol, atıksu hattı, yapılar ve peyzaj tek sohbette." }
    en: { baslik: "From terrain to 3D model", yazi: "Terrain, road, waste water line, buildings and landscape in a single chat." }
    bolumler:
      - { t: 8,   tr: "Arazi", en: "Terrain" }
      - { t: 36,  tr: "Yol", en: "Road" }
      - { t: 88,  tr: "Altyapı", en: "Infrastructure" }
      - { t: 176, tr: "Yapılar", en: "Buildings" }
      - { t: 311, tr: "Peyzaj", en: "Landscape" }
      - { t: 355, tr: "3B gezinti", en: "3D walkthrough" }
  - kod: "v-kurallar"
    olcum: "kurallar-1080"
    dosya: "uzun/kurallar-1080.v1.mp4"
    kapak: "img/kapak/ATACAD_Kurallar_v4_kapak.jpg"
    altyazi: "altyazi/kurallar.en.vtt"
    tr: { baslik: "Yol tasarımı: tip kesit kurallarından metraja", yazi: "Güzergâh, tip kesit kuralları, dever, duvarlar, en kesit paftası ve metraj." }
    en: { baslik: "Road design: from typical section rules to quantities", yazi: "Alignment, typical section rules, superelevation, walls, cross-section sheet and quantity take-off." }
    bolumler:
      - { t: 8,   tr: "Güzergâh ve profil", en: "Alignment and profile" }
      - { t: 119, tr: "Tip kesit", en: "Typical section" }
      - { t: 218, tr: "Kurallar", en: "Rules" }
      - { t: 320, tr: "Koridor ve yarma", en: "Corridor and cut" }
      - { t: 446, tr: "Dever ve yerleşim", en: "Superelevation and built-up section" }
      - { t: 542, tr: "İkazlar", en: "Warnings" }
