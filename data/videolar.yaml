      - { t: 8,   tr: "Parsel ve karkas", en: "Parcel and frame" }
      - { t: 52,  tr: "Podyum", en: "Podium" }
      - { t: 77,  tr: "Kule", en: "Tower" }
      - { t: 120, tr: "Çatı", en: "Roof" }
      - { t: 138, tr: "Tesisat", en: "Services" }
      - { t: 172, tr: "Altyapı", en: "Infrastructure" }
      - { t: 203, tr: "İç mekân", en: "Interior" }
      - { t: 245, tr: "Peyzaj", en: "Landscape" }
      - { t: 284, tr: "Denetim", en: "Compliance check" }
      - { t: 328, tr: "Çıktı", en: "Output" }
