# Videolar. Dosyalar medya deposundadır (hugo.toml ▸ params.medyaKoku + dosya); ad sürümlüdür: video yenilenirse v2.
# Süre ve boyut ELLE yazılmaz: data/medya_olcum.json'dan gelir (CAD deposu Araclar/VideoKayıt/site/site_medya.py olc).
# olcum: o dosyadaki anahtar · t: kısa demonun kaynak videodaki başlangıç saniyesi · bolumler[].t: saniye

uzun:
  - kod: "v-erguvan"
    olcum: "erguvan-1080"
    dosya: "uzun/erguvan-1080.v1.mp4"
    kapak: "img/kapak/ATACAD_Claude_Erguvan_kapak.jpg"
    tr: { baslik: "İki kule, parselden IFC'ye", yazi: "Karkas, tesisat, peyzaj, denetim ve inşaat filmi." }
