# Sık sorulan sorular. Sıra sayfadaki sıradır. Cevapta {eposta} iletişim adresine, {kvkk} KVKK sayfasına açılır.
# SSS sayfası FAQPage yapılandırılmış verisini de bu listeden üretir (düz metin). Başka dil için `en:` eklenir.

- anahtar: deneme
  tr:
    soru: "Deneme nasıl başlar?"
    cevap: "Deneme formunu doldurursunuz; kurulum bağlantısı e-postanıza gelir. Programı açıp adınızı ve telefonunuzu yazdığınızda 30 günlük deneme başlar."
  en:
    soru: "How does the trial start?"
    cevap: "You fill in the trial form and the installer link arrives in your e-mail. The 30-day trial starts when you open the program and enter your name and phone number."

- anahtar: damga
  tr:
    soru: "Denemede kısıt var mı?"
    cevap: "Özellik kısıtı yoktur; bütün özellikler açıktır. Deneme süresince DXF, Excel, CSV ve LandXML çıktıları \"DEMO\" damgası taşır. Deneme bilgisayar başına bir kezdir."
  en:
    soru: "Are there restrictions in the trial?"
    cevap: "There is no feature restriction; every feature is open. During the trial, DXF, Excel, CSV and LandXML outputs carry a \"DEMO\" stamp. The trial is available once per computer."

- anahtar: fiyat
  tr:
    soru: "Fiyatı nedir?"
    cevap: "Fiyat sitede yayınlanmaz. Deneme sırasında ya da sonunda {eposta} adresine yazın."
  en:
    soru: "What does it cost?"
    cevap: "The price is not published on the site. During or after the trial, write to {eposta}."

- anahtar: sistem
  tr:
    soru: "Hangi bilgisayarda çalışır?"
    cevap: "Windows 10 ve 11'de, 64 bit sürümde çalışır. Ayrıca kurulacak bir şey yoktur. 3B görünüm için DirectX 11 destekli bir ekran kartı gerekir."
  en:
    soru: "What computer does it run on?"
    cevap: "It runs on 64-bit Windows 10 and 11. Nothing else needs to be installed. The 3D view needs a graphics card that supports DirectX 11."

- anahtar: lisans-gerek
  tr:
    soru: "Başka bir CAD programı gerekir mi?"
    cevap: "Hayır. ATA CAD kendi başına çalışır; başka bir CAD lisansı gerekmez."
  en:
    soru: "Do I need another CAD program?"
    cevap: "No. ATA CAD runs on its own; no other CAD licence is required."

- anahtar: dwg
  tr:
    soru: "Mevcut DWG projelerimi açabilir miyim?"
    cevap: "DWG ve DXF dosyaları okunur. DWG'ye yazılmaz; çizim DXF olarak verilir. Güzergâh ve yüzey LandXML ile aktarılır."
  en:
    soru: "Can I open my existing DWG projects?"
    cevap: "DWG and DXF files are read. DWG is not written; drawings are delivered as DXF. Alignment and surface are exchanged through LandXML."

- anahtar: kurum
  tr:
    soru: "Hangi kurum kuralları var?"
    cevap: "İller Bankası, İSKİ ve DSİ kuralları ile KGM El Kitabı tabloları programın içindedir. Her değer kaynağını taşır; kaynağı doğrulanmamış değer hesaba girmez."
  en:
    soru: "Which institutional rules are included?"
    cevap: "The rules of İller Bankası (Turkey's municipal development bank), İSKİ (Istanbul Water and Sewerage Administration) and DSİ (State Hydraulic Works), and the tables of the KGM (General Directorate of Highways) handbook are built into the program. Every value carries its source; a value whose source is not verified does not enter the calculation."

- anahtar: yz
  tr:
    soru: "Yapay zekâ için ayrıca ödeme var mı?"
    cevap: "Hayır. ATA CAD yapay zekâ için ek ücret almaz; kendi Claude üyeliğinizi kullanırsınız."
  en:
    soru: "Is there a separate charge for AI?"
    cevap: "No. ATA CAD charges nothing extra for AI; you use your own Claude subscription."

- anahtar: veri
  tr:
    soru: "Projem nerede durur?"
    cevap: "Proje dosyanız kendi bilgisayarınızda durur; sunucuya gönderilmez. Lisans doğrulaması için giden bilgiler programın ilk açılışta gösterdiği aydınlatma metninde yazılıdır. Deneme formuna yazdıklarınızın nasıl işlendiği için {kvkk} bakın."
  en:
    soru: "Where does my project stay?"
    cevap: "Your project file stays on your own computer; it is not sent to a server. The data sent for licence verification is described in the privacy notice the program shows on first launch. For how what you type into the trial form is processed, see {kvkk}."

- anahtar: destek
  tr:
    soru: "Destek nasıl alırım?"
    cevap: "{eposta} adresine yazın. Yanıt genellikle aynı iş günü içinde gelir."
  en:
    soru: "How do I get support?"
    cevap: "Write to {eposta}. A reply usually comes within the same working day."

- anahtar: mac
  tr:
    soru: "Mac ya da Linux sürümü var mı?"
    cevap: "Hayır. ATA CAD yalnız Windows için hazırlanmıştır."
  en:
    soru: "Is there a Mac or Linux version?"
    cevap: "No. ATA CAD is built for Windows only."

- anahtar: dil
  en:
    soru: "Is the program available in English?"
    cevap: "No. The interface and commands are in Turkish. This site is in English so that you can see what the program does."
