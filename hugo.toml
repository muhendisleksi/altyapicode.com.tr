baseURL = "https://altyapicode.com.tr/"          # alan adı taşınınca atacad.com.tr
title = "ATA CAD"
enableRobotsTXT = true
# BEKLEME KİPİ ("çok yakında" sayfası) kapalı. Açmak için bu satırı
#   disableKinds = ["taxonomy", "term", "RSS", "page", "section", "sitemap"]
# hâline getir ve [params] altına `yakinda = true` satırını ekle (ikisi birlikte).
disableKinds = ["taxonomy", "term", "RSS"]
defaultContentLanguage = "tr"
defaultContentLanguageInSubdir = false

[languages.tr]
  languageCode = "tr-TR"
  languageName = "Türkçe"
  weight = 1
  [languages.tr.params]
    description = "ATA CAD yolu, altyapı ağını ve 3B modeli aynı dosyada çizer. Kübaj, pafta ve metraj o modelden çıkar. Başka bir CAD lisansı gerekmez."

  [[languages.tr.menus.main]]
    identifier = "altyapi"
    name = "Altyapı"
    pageRef = "/altyapi"
    weight = 10
  [[languages.tr.menus.main]]
    identifier = "yol-ve-arazi"
    name = "Yol ve arazi"
    pageRef = "/yol-ve-arazi"
    weight = 20
  [[languages.tr.menus.main]]
    identifier = "3b-model"
    name = "3B model"
    pageRef = "/3b-model-ve-denetim"
    weight = 30
  [[languages.tr.menus.main]]
    identifier = "yapay-zeka"
    name = "Yapay zekâ"
    pageRef = "/yapay-zeka"
    weight = 40
  [[languages.tr.menus.main]]
    identifier = "yetenekler"
    name = "Yetenekler"
    pageRef = "/yetenekler"
    weight = 50
  [[languages.tr.menus.main]]
    identifier = "demolar"
    name = "Demolar"
    pageRef = "/demolar"
    weight = 60

[languages.en]
  languageCode = "en"
  languageName = "English"
  weight = 2
  [languages.en.params]
    description = "ATA CAD draws the road, the utility network and the 3D model in one file. Earthwork volumes, sheets and quantities come from that model. No other CAD licence required."

  [[languages.en.menus.main]]
    identifier = "altyapi"
    name = "Infrastructure"
    pageRef = "/altyapi"
    weight = 10
  [[languages.en.menus.main]]
    identifier = "yol-ve-arazi"
    name = "Road and terrain"
    pageRef = "/yol-ve-arazi"
    weight = 20
  [[languages.en.menus.main]]
    identifier = "3b-model"
    name = "3D model"
    pageRef = "/3b-model-ve-denetim"
    weight = 30
  [[languages.en.menus.main]]
    identifier = "yapay-zeka"
    name = "AI"
    pageRef = "/yapay-zeka"
    weight = 40
  [[languages.en.menus.main]]
    identifier = "yetenekler"
    name = "Capabilities"
    pageRef = "/yetenekler"
    weight = 50
  [[languages.en.menus.main]]
    identifier = "demolar"
    name = "Demos"
    pageRef = "/demolar"
    weight = 60

[params]
  marka    = "ATA CAD"
  surum    = "1.0.3"
  eposta   = "bilgi@altyapicode.com.tr"           # alan adı taşınınca bilgi@atacad.com.tr
  formAdresi = "https://form.altyapicode.com.tr/v1/deneme-istegi"   # canlı form sunucusu (2026-11-10); boş bırakılırsa form kapanır
  turnstileAnahtar = "0x4AAAAAAF7uTEi6TmjnI0KV"    # Turnstile açık site anahtarı (gizli değil); formAdresi boşken yüklenmez
  medyaKoku = "https://medya.altyapicode.com.tr/"  # R2 atacad-medya; dosya adları data/videolar.yaml

[markup.goldmark.renderer]
  unsafe = true
[outputs]
  home = ["HTML"]
