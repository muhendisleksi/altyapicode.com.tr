baseURL = "https://altyapicode.com.tr/"
languageCode = "tr-TR"
defaultContentLanguage = "tr"
title = "ATA CAD — Bağımsız Altyapı CAD Platformu"
enableRobotsTXT = true

# Bu sitede etiket/kategori arsivi yok — gurultu yapiyordu.
disableKinds = ["taxonomy", "term"]

[params]
  marka          = "ATA CAD"
  altbaslik      = "Bağımsız Altyapı CAD Platformu"
  sahis          = "Abdulbaki Atakan"
  surum          = "v0.9 · geliştirme"
  asama          = "Erken Erişim"
  eposta         = "abdulbakiatakan@gmail.com"
  telefonGorunen = "+90 545 563 68 67"
  whatsapp       = "https://wa.me/905455636867?text=Merhaba%2C%20ATA%20CAD%20erken%20eri%C5%9Fim%20listesi%20i%C3%A7in%20yaz%C4%B1yorum."
  description    = "ATA CAD, altyapı projeleri için geliştirilmiş bağımsız ve modüler bir 3B CAD platformudur. Arazi, güzergâh, profil, koridor, kübaj, altyapı, havza ve istinat duvarı modülleriyle İller Bankası, İSKİ ve DSİ standartlarında proje ve metraj."

  # Araç alanı ağacı ve modül panelleri bu listeden üretilir — tek kaynak.
  # durum: var | yapiliyor | planli
  [[params.moduller]]
    id = "cekirdek"
    kod = "ÇEKİRDEK"
    ad = "CAD Çekirdeği"
    durum = "var"
    etiket = "çalışıyor"
    aciklama = "Çizim, düzenleme, katman, stil, seçim, kenetleme, grip, blok, ölçü ve çıktı."

  [[params.moduller]]
    id = "arazi"
    kod = "ARAZİ"
    ad = "Arazi ve Yüzey"
    durum = "var"
    etiket = "çalışıyor"
    aciklama = "Ölçüm noktası, nokta grupları, TIN yüzey, eşyükselti eğrileri ve yüzey analizi."

  [[params.moduller]]
    id = "guzergah"
    kod = "GÜZERGÂH"
    ad = "Güzergâh"
    durum = "var"
    etiket = "çalışıyor"
    aciklama = "Yatay geometri, PI ekleme/silme/ayırma, kilometraj denklemleri, ofset güzergâh, kısıt tabanlı parça ve LandXML aktarımı."

  [[params.moduller]]
    id = "profil"
    kod = "PROFİL"
    ad = "Profil ve En Kesit"
    durum = "var"
    etiket = "çalışıyor"
    aciklama = "Boyuna profil ve profil görünümü, kırmızı hat, örnek hatları ve en kesit üretimi. Güzergâh ile yüzeyin üzerine oturur."

  [[params.moduller]]
    id = "koridor"
    kod = "KORİDOR"
    ad = "Tip Kesit ve Koridor"
    durum = "var"
    etiket = "çalışıyor"
    aciklama = "Ölçüyle düzenlenen tip kesit tanımları, KGM kesit kütüphanesi, koridor modeli ve koridordan proje yüzeyi."

  [[params.moduller]]
    id = "kubaj"
    kod = "KÜBAJ"
    ad = "Kübaj"
    durum = "var"
    etiket = "çalışıyor"
    aciklama = "İki yüzeyden ve güzergâhtan hacim, kazı tasarımı, kütle dağılımı (Brückner), kübaj panosu ve CSV çıktısı."

  [[params.moduller]]
    id = "altyapi"
    kod = "ALTYAPI"
    ad = "Altyapı"
    durum = "planli"
    etiket = "planlı"
    aciklama = "Kanalizasyon, yağmursuyu, içmesuyu. Boru ağı, baca, hendek kesiti, kurum kontrolleri ve İller Bankası formatında metraj."

  [[params.moduller]]
    id = "havza"
    kod = "HAVZA"
    ad = "Havza"
    durum = "planli"
    etiket = "planlı"
    aciklama = "Havza tanımı, akış hesabı ve yağmursuyu debisi."

  [[params.moduller]]
    id = "istinat"
    kod = "İSTİNAT"
    ad = "İstinat Duvarı"
    durum = "planli"
    etiket = "planlı"
    aciklama = "Stabilite kontrolü, TBDY-2018 deprem hesabı, kesit çizimi ve metraj. Ayrı mühendislik modülü."

