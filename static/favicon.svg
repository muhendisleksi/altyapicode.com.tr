<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ATA CAD">
  <!-- Sekmede 16 pikselde okunması gereken tek şey marka harfidir: ince çizgi
       ve ızgara detayı o boyutta lapaya dönüşür. Bu yüzden simge tek kalın
       harften ibarettir ve kareyi neredeyse boydan boya doldurur.
       Renkler başlıktaki marka rozetiyle aynı ailedendir (vurgu mavisi).
       Not: XML yorumunun içinde çift tire kullanılamaz, belge geçersiz olur. -->
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#1B55B4"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#zemin)"/>

  <!-- A — iki bacak + kiriş. Yuvarlatılmış uçlar küçük boyutta kenarların
       tırtıklanmasını engelliyor. -->
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 46 L32 15 L49 46"/>
    <path d="M21.5 35 H42.5"/>
  </g>

  <!-- Harfin oturduğu zemin hattı. 16 pikselde silik kalır, büyük boyutta
       simgeye taban verir. -->
  <rect x="12" y="52.5" width="40" height="3.5" rx="1.75" fill="#fff" opacity=".5"/>
</svg>
