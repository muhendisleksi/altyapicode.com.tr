{{- /* Video oynatıcı: çerçeve içinde yerel <video>. Dosya medya deposundan, kapak siteden.
       Girdi: dict "v" <videolar.yaml kaydı: dosya, kapak, altyazi> "ad" "<erişilebilir ad>" */ -}}
{{- $v := .v }}
{{- $poster := "" }}
{{- with resources.Get $v.kapak }}{{ $poster = (.Fill "1280x720 Center webp q82").RelPermalink }}{{ end }}
<div class="cerceve oynatici">
  <video controls preload="none" playsinline src="{{ site.Params.medyaKoku }}{{ $v.dosya }}"{{ with $poster }} poster="{{ . }}"{{ end }} aria-label="{{ .ad }}">
    {{- with $v.altyazi }}
    <track kind="subtitles" srclang="en" label="English" src="{{ . | relURL }}"{{ if eq site.Language.Lang "en" }} default{{ end }}>
    {{- end }}
  </video>
</div>
